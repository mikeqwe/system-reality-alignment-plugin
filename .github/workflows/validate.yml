name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.x"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # retained from v1.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # retained from v1.1
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 scripts/validate_package.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/build_release.py --output-dir "$RUNNER_TEMP/dist"
